# Example caller. Copy this to .github/workflows/streak.yml in YOUR repo
# and replace OWNER with the account that hosts commit-heartbeat.
name: Streak guard

on:
  # Times are UTC. Pick times that suit your timezone; avoid minute 0.
  # GitHub often starts scheduled runs 1-3 hours late, so keep the final run
  # well before 00:00 UTC.
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 8 * * *"
    - cron: "23 12 * * *"
    - cron: "23 16 * * *"
    - cron: "37 19 * * *"   # final backup, ~4h before 00:00 UTC
  # Adds the "Run workflow" button.
  workflow_dispatch:
    inputs:
      force:
        description: "Make a test commit even if already active today"
        type: boolean
        default: false

# Let the bot push commits.
permissions:
  contents: write

jobs:
  heartbeat:
    # Pin to a version tag, not @main.
    uses: OWNER/commit-heartbeat/.github/workflows/heartbeat.yml@v3
    permissions:
      contents: write
    with:
      force: ${{ inputs.force == true }}
      target: 20
      per_run: 3
      # Must match the last cron line above: that run tops up to target.
      final_run: ${{ github.event.schedule == '37 19 * * *' }}
    # Passes GIT_USER_NAME, GIT_USER_EMAIL, GH_USERNAME, CONTRIB_TOKEN.
    secrets: inherit
